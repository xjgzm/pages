<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube Live Chat Translator</title>
<meta http-equiv="refresh" content="0; url=./index-en.html" />
<link rel="icon" type="image/png" href="./assets/icon.png" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0c10;
    color: #8b93a3;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
  }
  .center {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 0 20px;
  }
  img { width: 40px; height: 40px; border-radius: 10px; }
  p { margin: 0; font-size: 14px; }
  a { color: #ff2d4e; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="center">
    <img src="./assets/icon.png" alt="" />
    <p>Redirecting… / リダイレクトしています…</p>
    <p>
      <a href="./index-ja.html">日本語</a>
      &nbsp;&middot;&nbsp;
      <a href="./index-en.html">English</a>
    </p>
  </div>

  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      var target = lang.indexOf("ja") === 0 ? "./index-ja.html" : "./index-en.html";
      window.location.replace(target);
    })();
  </script>
</body>
</html>
